<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Camiones</title>
<meta name="theme-color" content="#1F4E78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklist Camiones">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --azul:#1F4E78; --verde:#2E7D32; --rojo:#C62828; --gris:#f3f5f8; --txt:#1c1c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--gris); color:var(--txt); }
  header { background:var(--azul); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; }
  .logo-box { background:#fff; border-radius:10px; padding:6px 10px; flex-shrink:0; }
  .logo-box img { height:34px; display:block; }
  header h1 { font-size:18px; margin:0 0 2px; }
  #progreso { font-size:13px; opacity:.9; }
  main { padding:12px 16px 120px; max-width:560px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  label { display:block; font-size:14px; font-weight:600; margin:10px 0 4px; }
  input, select, textarea { width:100%; font-size:17px; padding:12px; border:1px solid #c9d1db; border-radius:10px; background:#fff; }
  input[readonly] { background:#eef2f7; }
  textarea { min-height:70px; }
  h2 { font-size:15px; color:var(--azul); margin:18px 4px 8px; text-transform:uppercase; letter-spacing:.4px; }
  .item { background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .item p { margin:0 0 8px; font-size:16px; }
  .botones { display:flex; gap:8px; }
  .botones button { flex:1; padding:12px 6px; font-size:16px; font-weight:600; border:2px solid #c9d1db; border-radius:10px; background:#fff; cursor:pointer; }
  .botones button.ok.sel { background:var(--verde); border-color:var(--verde); color:#fff; }
  .botones button.falla.sel { background:var(--rojo); border-color:var(--rojo); color:#fff; }
  .radio { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .radio label { font-weight:500; background:#fff; border:1px solid #c9d1db; border-radius:10px; padding:12px; margin:0; }
  .radio input { width:auto; margin-right:8px; }
  .btn-sec { margin-top:8px; padding:8px 12px; font-size:14px; border:1px solid #c9d1db; border-radius:8px; background:#fff; }
  .btn-prin { margin-top:12px; width:100%; padding:12px; font-size:16px; border:0; border-radius:10px; background:var(--azul); color:#fff; }
  .footer { position:fixed; bottom:0; left:0; right:0; background:#fff; padding:12px 16px; box-shadow:0 -2px 6px rgba(0,0,0,.1); }
  .footer button { width:100%; max-width:560px; margin:0 auto; display:block; padding:14px; font-size:18px; font-weight:700; color:#fff; background:var(--azul); border:0; border-radius:12px; }
  .footer button:disabled { background:#9aa7b6; }
  .err { color:#8a1c1c; font-size:13px; margin-top:6px; }
  #msg { font-size:15px; padding:12px; border-radius:10px; margin-bottom:12px; display:none; }
  #msg.err { display:block; background:#fdecea; color:#8a1c1c; }
  #msg.ok { display:block; background:#e8f5e9; color:#1b5e20; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="logo-box"><img src="logo-header.png" alt="Ricardo Nini S.A."></div>
  <div>
    <h1>Checklist de camión</h1>
    <div id="progreso">Ingresá la patente del camión</div>
  </div>
</header>

<main>
  <div id="msg"></div>

  <div id="gate" class="card hidden">
    <label for="gpatente">Ingresá la patente del camión</label>
    <input id="gpatente" autocapitalize="characters" autocomplete="off" placeholder="Ej: AE998BX" onkeydown="if(event.key==='Enter')entrar()">
    <div id="gmsg" class="err"></div>
    <button class="btn-prin" onclick="entrar()">Ingresar</button>
  </div>

  <form id="form" class="hidden" onsubmit="return false">
    <div class="card">
      <label for="patente">Patente del camión</label>
      <input id="patente" readonly autocomplete="off">
      <div id="modelo" style="margin-top:8px;font-size:14px;color:#555"></div>
      <button class="btn-sec" onclick="mostrarGate()">Cambiar camión</button>

      <label for="legajo">Tu legajo</label>
      <input id="legajo" inputmode="numeric" autocomplete="off" oninput="actualizar()" onchange="buscarLegajo()">
      <div id="lmsg" class="err"></div>

      <label for="nombre">Apellido y nombre</label>
      <input id="nombre" readonly autocomplete="off" placeholder="Se completa con el legajo">
    </div>

    <div id="items"></div>

    <div class="card">
      <label>Resultado general</label>
      <div class="radio" id="resultados"></div>

      <label for="comentarios">Comentarios / observaciones</label>
      <textarea id="comentarios"></textarea>
    </div>
  </form>
</main>

<div class="footer">
  <button id="enviar" onclick="enviar()" disabled>Enviar checklist</button>
</div>

<script>
// URL de la aplicación web de Apps Script (termina en /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbyZUAlA__Pfq2ly7bo7F33Pv32j4ckquG7tfrXmblARYFI2lbVkvaPOIwdPsxx95ic7/exec';

let CFG = null;
let estado = { items: {}, resultado: null, persona: false };

// ---------- utilidades ----------
function mostrarMsg(texto, tipo) {
  const m = document.getElementById('msg');
  m.textContent = texto;
  m.className = tipo;
  window.scrollTo(0, 0);
}
function getLegajo() { try { return localStorage.getItem('chk_legajo') || ''; } catch (e) { return ''; } }
function setLegajo(l) { try { localStorage.setItem('chk_legajo', l); } catch (e) {} }
function normPatente(p) { return String(p || '').toUpperCase().replace(/[\s\-]/g, ''); }

async function api(params) {
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const r = await fetch(url);
  return r.json();
}

// ---------- arranque ----------
async function iniciar() {
  if (API_URL.includes('PEGAR_AQUI')) {
    mostrarMsg('Falta configurar la URL de la aplicación (API_URL).', 'err');
    return;
  }
  try {
    CFG = await api({ action: 'config' });
    armarFormulario();
  } catch (e) {
    mostrarMsg('No se pudo cargar la aplicación. Revisá la conexión y recargá.', 'err');
  }
}

function armarFormulario() {
  const res = document.getElementById('resultados');
  res.innerHTML = Object.keys(CFG.resultados).map(k =>
    '<label><input type="radio" name="res" value="' + k + '" onchange="setResultado(\'' + k + '\')"> ' + CFG.resultados[k] + '</label>'
  ).join('');

  let html = '', bloqueActual = '';
  CFG.items.forEach(it => {
    if (it.bloque !== bloqueActual) { bloqueActual = it.bloque; html += '<h2>' + bloqueActual + '</h2>'; }
    html += '<div class="item"><p>' + it.label + '</p><div class="botones">' +
      '<button class="ok" data-id="' + it.id + '" data-v="OK" onclick="marcar(this)">Conforme</button>' +
      '<button class="falla" data-id="' + it.id + '" data-v="FALLA" onclick="marcar(this)">Con falla</button>' +
      '</div></div>';
  });
  document.getElementById('items').innerHTML = html;

  const legajoGuardado = getLegajo();
  if (legajoGuardado) document.getElementById('legajo').value = legajoGuardado;
  if (legajoGuardado) buscarLegajo();

  mostrarGate();
}

// ---------- pantalla de patente ----------
function mostrarGate() {
  document.getElementById('form').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('gpatente').value = '';
  document.getElementById('gmsg').textContent = '';
  document.getElementById('patente').value = '';
  document.getElementById('modelo').textContent = '';
  document.getElementById('progreso').textContent = 'Ingresá la patente del camión';
  window.scrollTo(0, 0);
  setTimeout(() => document.getElementById('gpatente').focus(), 100);
}

function entrar() {
  const p = normPatente(document.getElementById('gpatente').value);
  const t = CFG.trucks.find(x => x.patente === p);
  if (!t) {
    document.getElementById('gmsg').textContent = 'Esa patente no está en la lista de camiones activos.';
    return;
  }
  document.getElementById('patente').value = t.patente;
  document.getElementById('modelo').textContent = 'Modelo: ' + (t.modelo || 'sin cargar');
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('form').classList.remove('hidden');
  window.scrollTo(0, 0);
  actualizar();
}

// ---------- legajo ----------
async function buscarLegajo() {
  const l = document.getElementById('legajo').value.trim();
  document.getElementById('nombre').value = '';
  document.getElementById('lmsg').textContent = '';
  estado.persona = false;
  actualizar();
  if (!l) return;
  try {
    const p = await api({ action: 'persona', legajo: l });
    if (p && p.nombre) {
      document.getElementById('nombre').value = p.nombre;
      estado.persona = true;
    } else {
      document.getElementById('lmsg').textContent = 'Legajo no encontrado o inactivo.';
    }
  } catch (e) {
    document.getElementById('lmsg').textContent = 'No se pudo verificar el legajo. Intentá de nuevo.';
  }
  actualizar();
}

// ---------- ítems ----------
function marcar(btn) {
  const id = btn.dataset.id, v = btn.dataset.v;
  estado.items[id] = v;
  document.querySelectorAll('button[data-id="' + id + '"]').forEach(b => {
    b.classList.toggle('sel', b.dataset.v === v);
  });
  actualizar();
}

function setResultado(k) {
  estado.resultado = k;
  actualizar();
}

function actualizar() {
  const p = normPatente(document.getElementById('patente').value);
  const valido = !!CFG && CFG.trucks.some(t => t.patente === p);
  const legajo = document.getElementById('legajo').value.trim();
  const respondidos = CFG ? CFG.items.filter(i => estado.items[i.id]).length : 0;
  const total = CFG ? CFG.items.length : 45;

  document.getElementById('progreso').textContent = 'Ítems respondidos: ' + respondidos + ' / ' + total;

  const completo = valido && /^\d{1,8}$/.test(legajo) && estado.persona &&
    estado.resultado && respondidos === total;
  document.getElementById('enviar').disabled = !completo;
}

// ---------- envío ----------
async function enviar() {
  const btn = document.getElementById('enviar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const datos = {
    patente: document.getElementById('patente').value,
    legajo: document.getElementById('legajo').value.trim(),
    nombre: document.getElementById('nombre').value.trim(),
    resultado: estado.resultado,
    comentarios: document.getElementById('comentarios').value.trim(),
    items: estado.items
  };
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(datos)
    }).then(x => x.json());
    btn.textContent = 'Enviar checklist';
    if (r.ok) {
      setLegajo(datos.legajo);
      mostrarMsg('Checklist enviado. ' + (r.fallas ? r.fallas + ' ítem(s) con falla quedaron registrados.' : 'Sin fallas.'), 'ok');
      reiniciar();
    } else {
      mostrarMsg(r.error, 'err');
      actualizar();
    }
  } catch (e) {
    btn.textContent = 'Enviar checklist';
    mostrarMsg('Error al enviar. Revisá la conexión e intentá de nuevo.', 'err');
    actualizar();
  }
}

function reiniciar() {
  estado = { items: {}, resultado: null, persona: false };
  document.getElementById('comentarios').value = '';
  document.querySelectorAll('input[name=res]').forEach(r => r.checked = false);
  document.querySelectorAll('.botones button.sel').forEach(b => b.classList.remove('sel'));
  mostrarGate();
  buscarLegajo();
}

// Registro del service worker para que el navegador ofrezca instalar la app
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

iniciar();
</script>
</body>
</html>
